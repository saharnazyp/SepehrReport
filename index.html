<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>گزارش وضعیت فعالیت روزانه | سپهر</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(191, 151, 58, 0.10), transparent 35%),
        linear-gradient(135deg, #f8f5ee 0%, #f3efe5 100%);
      color: #1d2b3a;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 40px auto;
    }

    .header {
      background: linear-gradient(135deg, #17283a, #253c53);
      color: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 18px 45px rgba(23, 40, 58, 0.18);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(207, 169, 78, 0.10);
      left: -80px;
      top: -100px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .header p {
      margin: 0;
      color: #e8edf2;
      font-size: 15px;
      position: relative;
      z-index: 1;
    }

    .gold-line {
      width: 80px;
      height: 4px;
      border-radius: 10px;
      background: #c9a34f;
      margin: 18px 0 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(201, 163, 79, 0.22);
      border-radius: 22px;
      padding: 26px;
      margin-bottom: 22px;
      box-shadow: 0 12px 35px rgba(30, 45, 60, 0.08);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      color: #17283a;
      font-size: 19px;
      font-weight: 800;
    }

    .section-title span {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5ead0;
      color: #a77d20;
      border-radius: 10px;
      font-size: 17px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      color: #394b5e;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d9dfe5;
      border-radius: 12px;
      padding: 13px 14px;
      font-family: inherit;
      font-size: 14px;
      color: #243447;
      background: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #c9a34f;
      box-shadow: 0 0 0 4px rgba(201, 163, 79, 0.10);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .activities {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .activity {
      border: 1px solid #e0e4e8;
      border-radius: 18px;
      padding: 20px;
      background: #fcfcfb;
      position: relative;
    }

    .activity-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .activity-number {
      font-weight: 800;
      color: #17283a;
      font-size: 16px;
    }

    .remove-btn {
      border: none;
      background: #f8e7e7;
      color: #a33b3b;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
    }

    .remove-btn:hover {
      background: #f2d3d3;
    }

    .activity-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .activity-grid .full {
      grid-column: 1 / -1;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-wrapper input[type="range"] {
      padding: 0;
      border: none;
      box-shadow: none;
      accent-color: #b38b32;
    }

    .progress-value {
      min-width: 50px;
      text-align: center;
      background: #f4ead1;
      color: #8a681d;
      padding: 7px 9px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
    }

    .add-btn {
      width: 100%;
      border: 2px dashed #c9a34f;
      background: #fffaf0;
      color: #8a681d;
      border-radius: 13px;
      padding: 13px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 18px;
    }

    .add-btn:hover {
      background: #fff5dd;
    }

    .submit-area {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .submit-btn {
      border: none;
      border-radius: 14px;
      padding: 15px 30px;
      background: linear-gradient(135deg, #b88c32, #d2ad5b);
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(184, 140, 50, 0.22);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 26px rgba(184, 140, 50, 0.28);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status-message {
      display: none;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .status-message.success {
      display: block;
      background: #e8f6ec;
      color: #24703b;
      border: 1px solid #bde5c8;
    }

    .status-message.error {
      display: block;
      background: #fff0f0;
      color: #9b3030;
      border: 1px solid #efc4c4;
    }

    .status-message.loading {
      display: block;
      background: #f1f5f9;
      color: #425466;
      border: 1px solid #d9e0e7;
    }

    .footer {
      text-align: center;
      color: #7a8794;
      font-size: 12px;
      padding: 10px 0 30px;
    }

    @media (max-width: 768px) {
      .container {
        width: min(100% - 20px, 1100px);
        margin: 20px auto;
      }

      .header {
        padding: 24px 20px;
      }

      .header h1 {
        font-size: 22px;
      }

      .card {
        padding: 18px;
      }

      .form-grid,
      .activity-grid {
        grid-template-columns: 1fr;
      }

      .field.full,
      .activity-grid .full {
        grid-column: auto;
      }

      .submit-area {
        flex-direction: column;
        align-items: stretch;
      }

      .submit-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">
    <h1>گزارش وضعیت فعالیت روزانه</h1>
    <p>سپهر | ثبت دقیق فعالیت‌های انجام‌شده</p>
    <div class="gold-line"></div>
  </header>

  <form id="reportForm">

    <!-- اطلاعات پایه -->
    <section class="card">

      <h2 class="section-title">
        <span>۱</span>
        اطلاعات پایه
      </h2>

      <div class="form-grid">

        <div class="field">
          <label for="unit">
            واحد
          </label>

          <select id="unit" required>
            <option value="">انتخاب واحد</option>
            <option value="0">مارکتینگ</option>
            <option value="1">مالی</option>
            <option value="2">حقوقی</option>
            <option value="3">دفتر مدیر عامل</option>
            <option value="4">منابع انسانی</option>
          </select>
        </div>

        <div class="field">
          <label for="employee">
            نام و نام خانوادگی
          </label>

          <input
            type="text"
            id="employee"
            placeholder="نام و نام خانوادگی"
            autocomplete="name"
            required
          />
        </div>

      </div>
    </section>


    <!-- فعالیت ها -->
    <section class="card">

      <h2 class="section-title">
        <span>۲</span>
        فعالیت‌های انجام‌شده
      </h2>

      <div id="activities" class="activities"></div>

      <button
        type="button"
        class="add-btn"
        id="addActivityBtn"
      >
        + افزودن فعالیت جدید
      </button>

    </section>


    <!-- ارسال -->
    <section class="card">

      <div id="statusMessage" class="status-message"></div>

      <div class="submit-area">

        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >
          ثبت گزارش
        </button>

      </div>

    </section>

  </form>

  <div class="footer">
    سامانه گزارش وضعیت فعالیت روزانه | سپهر
  </div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

const GOOGLE_APPS_SCRIPT_URL =
  'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnS1vQbr1tvw70IJToX2Vjo1lyxTWib2xJ9qxAp1VrX11A5QopzbzWWRLKMouLkYuHQ3A-D0ftoAln2fuNnzR7Hqk8vlMzGJ0jB4I5T6r6c0DdD3VhCcNGBM0snXb9O2VuMTA2cKgq0RWjSuPJWBRm9jXw_23A1kRoKUZA_-SmKJOXkSvuH6_YkY7moZMlDZDuMOEwGFXtcMlyNRzVXaScTNx4fIaXyqh7cxhaJvfIzkiWShDtTLPeveYBoD9cRGxBSi8DCuolvZFLlOu3r3_J4BtP4_1g&lib=MzVp7YMixE1Vxvd7O7FLPJIUYlFQAuFZV';


/* =========================================================
   UNIT NAMES
   ========================================================= */

const UNIT_NAMES = [
  'مارکتینگ',
  'مالی',
  'حقوقی',
  'دفتر مدیر عامل',
  'منابع انسانی'
];


/* =========================================================
   ELEMENTS
   ========================================================= */

const reportForm = document.getElementById('reportForm');
const activitiesContainer = document.getElementById('activities');
const addActivityBtn = document.getElementById('addActivityBtn');
const submitBtn = document.getElementById('submitBtn');
const statusMessage = document.getElementById('statusMessage');


/* =========================================================
   JALALI DATE
   ========================================================= */

function gregorianToJalali(gy, gm, gd) {

  const g_d_m = [
    0,
    31,
    59,
    90,
    120,
    151,
    181,
    212,
    243,
    273,
    304,
    334
  ];

  let jy;

  if (gy > 1600) {
    jy = 979;
    gy -= 1600;
  } else {
    jy = 0;
    gy -= 621;
  }

  const gy2 = gm > 2 ? gy + 1 : gy;

  let days =
    365 * gy +
    Math.floor((gy2 + 3) / 4) -
    Math.floor((gy2 + 99) / 100) +
    Math.floor((gy2 + 399) / 400) -
    80 +
    gd +
    g_d_m[gm - 1];

  jy += 33 * Math.floor(days / 12053);

  days %= 12053;

  jy += 4 * Math.floor(days / 1461);

  days %= 1461;

  if (days > 365) {
    jy += Math.floor((days - 1) / 365);
    days = (days - 1) % 365;
  }

  let jm;

  if (days < 186) {
    jm = 1 + Math.floor(days / 31);
  } else {
    jm = 7 + Math.floor((days - 186) / 30);
  }

  const jd =
    1 +
    (days < 186
      ? days % 31
      : (days - 186) % 30);

  return [
    jy,
    String(jm).padStart(2, '0'),
    String(jd).padStart(2, '0')
  ].join('/');
}


function todayJalali() {

  const now = new Date();

  return gregorianToJalali(
    now.getFullYear(),
    now.getMonth() + 1,
    now.getDate()
  );
}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(message, type) {

  statusMessage.textContent = message;

  statusMessage.className =
    'status-message ' + type;
}


function clearStatus() {

  statusMessage.textContent = '';

  statusMessage.className =
    'status-message';
}


/* =========================================================
   ACTIVITY
   ========================================================= */

let activityCounter = 0;


function createActivity() {

  activityCounter++;

  const activity = document.createElement('div');

  activity.className = 'activity';

  activity.dataset.id = activityCounter;

  activity.innerHTML = `

    <div class="activity-header">

      <div class="activity-number">
        فعالیت شماره ${activityCounter}
      </div>

      <button
        type="button"
        class="remove-btn"
        onclick="removeActivity(this)"
      >
        حذف
      </button>

    </div>


    <div class="activity-grid">

      <div class="field full">

        <label>
          شرح فعالیت
        </label>

        <textarea
          class="description"
          placeholder="شرح دقیق فعالیت انجام‌شده..."
          required
        ></textarea>

      </div>


      <div class="field">

        <label>
          وضعیت
        </label>

        <select class="status" required>

          <option value="">
            انتخاب وضعیت
          </option>

          <option value="انجام شد">
            انجام شد
          </option>

          <option value="در حال انجام">
            در حال انجام
          </option>

          <option value="متوقف شده">
            متوقف شده
          </option>

          <option value="در انتظار تأیید">
            در انتظار تأیید
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          درصد پیشرفت
        </label>

        <div class="progress-wrapper">

          <input
            type="range"
            class="progress"
            min="0"
            max="100"
            step="5"
            value="0"
          />

          <span class="progress-value">
            0%
          </span>

        </div>

      </div>


      <div class="field">

        <label>
          تاریخ فعالیت
        </label>

        <input
          type="text"
          class="activity-date"
          value="${todayJalali()}"
          placeholder="1405/06/29"
          required
        />

      </div>


      <div class="field">

        <label>
          مبلغ و سند مرتبط
        </label>

        <input
          type="text"
          class="document"
          placeholder="در صورت وجود"
        />

      </div>


      <div class="field">

        <label>
          مسئول
        </label>

        <input
          type="text"
          class="responsible"
          placeholder="مسئول انجام یا پیگیری"
        />

      </div>


      <div class="field">

        <label>
          اقدام بعدی
        </label>

        <input
          type="text"
          class="next-action"
          placeholder="اقدام بعدی"
        />

      </div>


      <div class="field full">

        <label>
          توضیحات و موانع
        </label>

        <textarea
          class="notes"
          placeholder="در صورت توقف یا انتظار تأیید، توضیحات و مانع را وارد کنید..."
        ></textarea>

      </div>

    </div>
  `;


  activitiesContainer.appendChild(activity);


  const progress =
    activity.querySelector('.progress');

  const progressValue =
    activity.querySelector('.progress-value');


  progress.addEventListener('input', function () {

    progressValue.textContent =
      this.value + '%';

  });


  const status =
    activity.querySelector('.status');

  const notes =
    activity.querySelector('.notes');


  status.addEventListener('change', function () {

    if (
      this.value === 'متوقف شده' ||
      this.value === 'در انتظار تأیید'
    ) {

      notes.required = true;

      notes.placeholder =
        'برای این وضعیت، توضیحات و مانع الزامی است...';

    } else {

      notes.required = false;

      notes.placeholder =
        'در صورت وجود، توضیحات و موانع را وارد کنید...';

    }

  });

}


/* =========================================================
   REMOVE ACTIVITY
   ========================================================= */

function removeActivity(button) {

  const activity =
    button.closest('.activity');

  if (!activity) return;

  activity.remove();

  renumberActivities();
}


function renumberActivities() {

  const activities =
    document.querySelectorAll('.activity');

  activities.forEach((activity, index) => {

    const title =
      activity.querySelector('.activity-number');

    if (title) {

      title.textContent =
        `فعالیت شماره ${index + 1}`;

    }

  });

}


/* =========================================================
   ADD ACTIVITY
   ========================================================= */

addActivityBtn.addEventListener(
  'click',
  createActivity
);


/* =========================================================
   INITIAL ACTIVITY
   ========================================================= */

createActivity();


/* =========================================================
   VALIDATE
   ========================================================= */

function validateForm() {

  const unit =
    document.getElementById('unit').value;

  const employee =
    document.getElementById('employee').value.trim();


  if (unit === '') {

    showStatus(
      'لطفاً واحد را انتخاب کنید.',
      'error'
    );

    document.getElementById('unit').focus();

    return false;
  }


  if (!employee) {

    showStatus(
      'لطفاً نام و نام خانوادگی را وارد کنید.',
      'error'
    );

    document.getElementById('employee').focus();

    return false;
  }


  const activities =
    document.querySelectorAll('.activity');


  if (activities.length === 0) {

    showStatus(
      'حداقل یک فعالیت باید ثبت شود.',
      'error'
    );

    return false;
  }


  for (let i = 0; i < activities.length; i++) {

    const activity = activities[i];

    const description =
      activity.querySelector('.description').value.trim();

    const status =
      activity.querySelector('.status').value;

    const notes =
      activity.querySelector('.notes').value.trim();


    if (!description) {

      showStatus(
        `شرح فعالیت شماره ${i + 1} را وارد کنید.`,
        'error'
      );

      activity
        .querySelector('.description')
        .focus();

      return false;
    }


    if (!status) {

      showStatus(
        `وضعیت فعالیت شماره ${i + 1} را انتخاب کنید.`,
        'error'
      );

      activity
        .querySelector('.status')
        .focus();

      return false;
    }


    if (
      (
        status === 'متوقف شده' ||
        status === 'در انتظار تأیید'
      ) &&
      !notes
    ) {

      showStatus(
        `برای فعالیت شماره ${i + 1}، توضیحات و موانع الزامی است.`,
        'error'
      );

      activity
        .querySelector('.notes')
        .focus();

      return false;
    }

  }


  return true;
}


/* =========================================================
   BUILD PAYLOAD
   ========================================================= */

function buildPayload() {

  const unitIndex =
    Number(
      document.getElementById('unit').value
    );

  const employee =
    document
      .getElementById('employee')
      .value
      .trim();


  const activityElements =
    document.querySelectorAll('.activity');


  const activities =
    Array.from(activityElements).map(
      activity => {

        return {

          description:
            activity
              .querySelector('.description')
              .value
              .trim(),

          status:
            activity
              .querySelector('.status')
              .value,

          progress:
            Number(
              activity
                .querySelector('.progress')
                .value
            ),

          activityDate:
            activity
              .querySelector('.activity-date')
              .value
              .trim(),

          document:
            activity
              .querySelector('.document')
              .value
              .trim(),

          responsible:
            activity
              .querySelector('.responsible')
              .value
              .trim(),

          nextAction:
            activity
              .querySelector('.next-action')
              .value
              .trim(),

          notes:
            activity
              .querySelector('.notes')
              .value
              .trim()

        };

      }
    );


  return {

    unitIndex,

    employee,

    activities

  };

}


/* =========================================================
   SUBMIT
   ========================================================= */

reportForm.addEventListener(
  'submit',
  async function(event) {

    event.preventDefault();

    clearStatus();


    if (!validateForm()) {

      return;

    }


    const data =
      buildPayload();


    console.log(
      'SEPEHR REPORT PAYLOAD:',
      data
    );


    submitBtn.disabled = true;

    submitBtn.textContent =
      'در حال ارسال...';


    showStatus(
      'در حال ارسال گزارش به سامانه سپهر...',
      'loading'
    );


    try {

      /*
       * IMPORTANT:
       *
       * Google Apps Script
       * با no-cors پاسخ قابل خواندن
       * به JavaScript نمی‌دهد.
       *
       * اما درخواست POST ارسال می‌شود.
       */

      await fetch(
        GOOGLE_APPS_SCRIPT_URL,
        {
          method: 'POST',

          mode: 'no-cors',

          headers: {
            'Content-Type':
              'text/plain;charset=UTF-8'
          },

          body:
            JSON.stringify(data)
        }
      );


      console.log(
        'SEPEHR REPORT: request sent'
      );


      showStatus(
        'گزارش با موفقیت ارسال شد.',
        'success'
      );


      /*
       * فرم بعد از ارسال موفق ظاهری
       * پاک می‌شود.
       */

      document
        .getElementById('employee')
        .value = '';

      document
        .getElementById('unit')
        .value = '';

      activitiesContainer.innerHTML = '';

      activityCounter = 0;

      createActivity();


    } catch (error) {

      console.error(
        'SEPEHR REPORT ERROR:',
        error
      );


      showStatus(
        'ارسال گزارش انجام نشد. لطفاً اتصال اینترنت و آدرس API را بررسی کنید.',
        'error'
      );

    } finally {

      submitBtn.disabled = false;

      submitBtn.textContent =
        'ثبت گزارش';

    }

  }
);
