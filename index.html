<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f7f1e7">

<title>گزارش وضعیت فعالیت روزانه | سپهر</title>

<style>

:root{
  --bg:#f6f0e6;
  --paper:#fffdf9;
  --paper2:#fbf6ee;
  --ink:#2d261f;
  --muted:#766b60;
  --gold:#b8872f;
  --gold2:#d5ad63;
  --brown:#6c4b2d;
  --line:#e4d7c5;
  --ok:#28734b;
  --danger:#a33a2b;
  --shadow:0 16px 45px rgba(92,65,35,.12);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Tahoma,
    "Segoe UI",
    Arial,
    sans-serif;

  color:var(--ink);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(184,135,47,.12),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #faf7f0,
      #efe5d5
    );

  min-height:100vh;
}

.wrap{
  max-width:1050px;
  margin:auto;
  padding:24px 14px 50px;
}

/* HERO */

.hero{
  background:
    linear-gradient(
      145deg,
      rgba(255,253,249,.97),
      rgba(248,239,226,.97)
    );

  border:1px solid var(--line);

  border-radius:26px;

  box-shadow:var(--shadow);

  padding:20px;

  position:relative;

  overflow:hidden;

  animation:up .55s ease;
}

.hero:before{
  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  opacity:.18;

  background-image:
    repeating-linear-gradient(
      0deg,
      transparent 0 3px,
      rgba(108,75,45,.04) 4px 5px
    );
}

.brand{
  display:flex;

  align-items:center;

  justify-content:center;

  gap:18px;

  position:relative;

  z-index:1;
}

.logo{
  width:92px;
  height:92px;

  object-fit:contain;

  border-radius:18px;

  background:#fff;

  border:1px solid var(--line);

  padding:7px;
}

.logo2{
  width:76px;
  height:76px;
}

h1{
  font-size:25px;

  margin:0 0 7px;

  color:#3a2a1b;
}

.subtitle{
  color:var(--muted);

  font-size:13px;
}

.notice{
  margin-top:18px;

  background:#fff8df;

  border:1px solid #ead29a;

  border-right:5px solid var(--gold);

  padding:15px 17px;

  border-radius:15px;

  line-height:1.9;

  font-size:14px;

  position:relative;

  z-index:1;
}

/* CARD */

.card{
  margin-top:16px;

  background:rgba(255,253,249,.96);

  border:1px solid var(--line);

  border-radius:22px;

  box-shadow:
    0 10px 30px rgba(92,65,35,.08);

  padding:18px;

  animation:up .65s ease;
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:14px;
}

.field label{
  display:block;

  font-weight:700;

  font-size:13px;

  margin-bottom:7px;
}

input,
select,
textarea{

  width:100%;

  border:
    1px solid #d8c9b5;

  border-radius:12px;

  background:#fff;

  padding:12px 13px;

  font:inherit;

  color:var(--ink);

  outline:none;

  transition:.2s;
}

input:focus,
select:focus,
textarea:focus{

  border-color:var(--gold);

  box-shadow:
    0 0 0 3px
    rgba(184,135,47,.12);
}

textarea{
  min-height:92px;

  resize:vertical;
}

/* SECTION */

.section-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:13px;
}

.section-title h2{

  font-size:17px;

  margin:0;
}

/* ACTIVITY */

.activity{

  border:
    1px solid var(--line);

  background:
    var(--paper2);

  border-radius:18px;

  padding:15px;

  margin-top:13px;

  position:relative;

  animation:up .35s ease;
}

.activity-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;
}

.badge{

  font-size:12px;

  font-weight:800;

  color:var(--brown);

  background:#f0e1ca;

  border-radius:999px;

  padding:6px 10px;
}

.activity-grid{

  display:grid;

  grid-template-columns:
    2fr 1fr 1fr;

  gap:12px;
}

.activity-grid .wide{

  grid-column:
    span 3;
}

/* BUTTONS */

.actions{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:16px;
}

button{

  border:0;

  border-radius:13px;

  padding:12px 18px;

  font:inherit;

  font-weight:800;

  cursor:pointer;

  transition:
    transform .15s,
    box-shadow .15s,
    opacity .15s;
}

button:hover{

  transform:
    translateY(-1px);
}

button:disabled{

  opacity:.65;

  cursor:not-allowed;

  transform:none;
}

.primary{

  background:
    linear-gradient(
      135deg,
      #b8872f,
      #8e6324
    );

  color:#fff;

  box-shadow:
    0 9px 20px
    rgba(142,99,36,.22);
}

.secondary{

  background:#f1e5d3;

  color:#5b4027;
}

.danger{

  background:#f7e2de;

  color:#9a3729;

  padding:
    7px 12px;

  font-size:12px;
}

/* MESSAGE */

#message{

  display:none;

  margin-top:14px;

  padding:13px 15px;

  border-radius:13px;

  font-weight:700;

  line-height:1.8;
}

#message.ok{

  display:block;

  background:#e5f4eb;

  color:#21633f;

  border:
    1px solid #b9dec7;
}

#message.err{

  display:block;

  background:#fbe8e5;

  color:#8c3025;

  border:
    1px solid #efc2bb;
}

/* SPINNER */

.spinner{

  display:inline-block;

  width:15px;

  height:15px;

  border:
    2px solid
    rgba(255,255,255,.45);

  border-top-color:#fff;

  border-radius:50%;

  animation:
    spin .7s linear infinite;

  vertical-align:-2px;

  margin-left:7px;
}

/* FOOTER INFO */

.api-status{

  margin-top:10px;

  font-size:11px;

  color:var(--muted);

  text-align:center;
}

/* MOBILE */

@media(max-width:720px){

  .wrap{

    padding:
      12px 10px 35px;
  }

  .hero{

    border-radius:20px;

    padding:15px;
  }

  .brand{

    gap:10px;
  }

  .logo{

    width:68px;

    height:68px;
  }

  .logo2{

    width:57px;

    height:57px;
  }

  h1{

    font-size:20px;
  }

  .subtitle{

    font-size:11px;
  }

  .grid,
  .activity-grid{

    grid-template-columns:1fr;
  }

  .activity-grid .wide{

    grid-column:
      span 1;
  }

  .card{

    border-radius:18px;

    padding:14px;
  }

  .section-title{

    align-items:flex-start;
  }

  .section-title button{

    white-space:nowrap;
  }

  .actions button{

    width:100%;
  }
}

/* ANIMATION */

@keyframes up{

  from{

    opacity:0;

    transform:
      translateY(10px);
  }

  to{

    opacity:1;

    transform:none;
  }
}

@keyframes spin{

  to{

    transform:
      rotate(360deg);
  }
}

</style>
</head>


<body>

<div class="wrap">

  <!-- HEADER -->

  <header class="hero">

    <div class="brand">

      <img
        class="logo"
        id="logo1Box"
        src="./logo.png"
        alt="لوگوی سپهر"
        onerror="this.style.display='none'"
      >

      <div style="text-align:center">

        <h1>
          گزارش وضعیت فعالیت روزانه
        </h1>

        <div class="subtitle">
          سپهر | ثبت دقیق فعالیت‌های انجام‌شده
        </div>

      </div>

      <img
        class="logo logo2"
        id="logo2Box"
        src="./logo2.png"
        alt="لوگوی سپهر"
        onerror="this.style.display='none'"
      >

    </div>


    <div class="notice">

      لطفاً
      <b>
        فعالیت‌های انجام‌شده در روز جاری را
        به‌صورت دقیق، کامل و به ترتیب زمانی
      </b>
      ثبت نمایید.

      <br>

      <b>
        توجه:
      </b>

      عدم ثبت این فرم به منزله عدم انجام فعالیت
      در روز جاری تلقی خواهد شد.

    </div>

  </header>


  <!-- FORM -->

  <form
    id="reportForm"
    novalidate
  >

    <!-- EMPLOYEE -->

    <section class="card">

      <div class="grid">

        <div class="field">

          <label for="unit">
            واحد / دپارتمان *
          </label>

          <select
            id="unit"
            required
          >

            <option value="">
              انتخاب واحد...
            </option>

            <option value="0">
              مارکتینگ
            </option>

            <option value="1">
              مالی
            </option>

            <option value="2">
              حقوقی
            </option>

            <option value="3">
              دفتر مدیر عامل
            </option>

            <option value="4">
              منابع انسانی
            </option>

          </select>

        </div>


        <div class="field">

          <label for="employee">
            نام و نام خانوادگی *
          </label>

          <input
            id="employee"
            required
            placeholder="نام و نام خانوادگی"
            autocomplete="name"
          >

        </div>

      </div>

    </section>


    <!-- ACTIVITIES -->

    <section class="card">

      <div class="section-title">

        <h2>
          گزارش وضعیت
        </h2>

        <button
          type="button"
          class="secondary"
          id="addBtn"
        >
          ＋ افزودن فعالیت
        </button>

      </div>


      <div id="activities"></div>


      <div class="actions">

        <button
          class="primary"
          id="submitBtn"
          type="submit"
        >
          ثبت گزارش روزانه
        </button>

      </div>


      <div id="message"></div>


      <div class="api-status">
        اتصال فرم به سامانه ثبت گزارش سپهر
      </div>

    </section>

  </form>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT WEB APP
   ========================================================= */

const GOOGLE_APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbymcEOkxod2e0iTewyug7MF49kmLqHg8b1Ps06C6Gtkmh1M_5ztgxnYw-qa3OU6Gcrj/exec';


/* =========================================================
   DOM
   ========================================================= */

const activities =
  document.getElementById('activities');

const form =
  document.getElementById('reportForm');

const msg =
  document.getElementById('message');

const submitBtn =
  document.getElementById('submitBtn');


/* =========================================================
   JALALI DATE
   ========================================================= */

function pad(n){

  return String(n).padStart(2,'0');

}


function gregorianToJalali(
  gy,
  gm,
  gd
){

  const gdm = [
    0,
    31,
    59,
    90,
    120,
    151,
    181,
    212,
    243,
    273,
    304,
    334
  ];

  let gy2 =
    gm > 2
      ? gy + 1
      : gy;

  let days =
    355666 +
    365 * gy +
    Math.floor((gy2 + 3) / 4) -
    Math.floor((gy2 + 99) / 100) +
    Math.floor((gy2 + 399) / 400) +
    gd +
    gdm[gm - 1];

  let jy =
    -1595 +
    33 * Math.floor(
      days / 12053
    );

  days %= 12053;

  jy +=
    4 * Math.floor(
      days / 1461
    );

  days %= 1461;

  if(days > 365){

    jy +=
      Math.floor(
        (days - 1) / 365
      );

    days =
      (days - 1) % 365;
  }

  const jm =
    days < 186
      ? 1 + Math.floor(days / 31)
      : 7 + Math.floor(
          (days - 186) / 30
        );

  const jd =
    1 +
    (
      days < 186
        ? days % 31
        : (days - 186) % 30
    );

  return `${jy}/${pad(jm)}/${pad(jd)}`;

}


function todayJalali(){

  const d =
    new Date();

  return gregorianToJalali(
    d.getFullYear(),
    d.getMonth() + 1,
    d.getDate()
  );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMsg(
  text,
  type
){

  msg.textContent =
    text;

  msg.className = '';

  msg.classList.add(
    type === 'ok'
      ? 'ok'
      : 'err'
  );

  msg.style.display =
    'block';

}


/* =========================================================
   ADD ACTIVITY
   ========================================================= */

function addActivity(){

  const el =
    document.createElement('div');

  el.className =
    'activity';


  el.innerHTML = `

    <div class="activity-head">

      <span class="badge">
        فعالیت
      </span>

      <button
        type="button"
        class="danger remove"
      >
        حذف
      </button>

    </div>


    <div class="activity-grid">


      <div class="field wide">

        <label>
          شرح فعالیت / پروژه *
        </label>

        <textarea
          class="description"
          required
          placeholder="فعالیت انجام‌شده را دقیق و به ترتیب زمانی بنویسید."
        ></textarea>

      </div>


      <div class="field">

        <label>
          وضعیت *
        </label>

        <select
          class="status"
          required
        >

          <option value="">
            انتخاب...
          </option>

          <option value="انجام شد">
            انجام شد
          </option>

          <option value="در حال انجام">
            در حال انجام
          </option>

          <option value="متوقف شده">
            متوقف شده
          </option>

          <option value="در انتظار تأیید">
            در انتظار تأیید
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          درصد پیشرفت *
        </label>

        <input
          class="progress"
          type="number"
          min="0"
          max="100"
          step="1"
          value="0"
          required
        >

      </div>


      <div class="field">

        <label>
          تاریخ *
        </label>

        <input
          class="date"
          value="${todayJalali()}"
          required
        >

      </div>


      <div class="field">

        <label>
          مبلغ / سند مرتبط
        </label>

        <input
          class="document"
          placeholder="اختیاری"
        >

      </div>


      <div class="field">

        <label>
          مسئول *
        </label>

        <input
          class="responsible"
          required
          placeholder="نام مسئول"
        >

      </div>


      <div class="field">

        <label>
          اقدام بعدی *
        </label>

        <input
          class="nextAction"
          required
          placeholder="اقدام بعدی"
        >

      </div>


      <div class="field wide">

        <label>
          توضیحات و موانع
        </label>

        <textarea
          class="notes"
          placeholder="در صورت توقف یا انتظار تأیید، توضیح مانع یا وضعیت را وارد کنید."
        ></textarea>

      </div>


    </div>
  `;


  activities.appendChild(el);


  el.querySelector('.remove')
    .onclick = () => {

      if(
        activities.children.length > 1
      ){

        el.remove();

      }else{

        showMsg(
          'حداقل یک فعالیت باید ثبت شود.',
          'err'
        );

      }

    };

}


/* اولین فعالیت */

addActivity();


/* دکمه افزودن */

document
  .getElementById('addBtn')
  .onclick = addActivity;


/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  'submit',
  async function(e){

    e.preventDefault();


    msg.style.display =
      'none';


    /* اعتبارسنجی HTML */

    if(
      !form.reportValidity()
    ){

      return;

    }


    const unitIndex =
      document
        .getElementById('unit')
        .value;


    const employee =
      document
        .getElementById('employee')
        .value
        .trim();


    const cards =
      [
        ...document.querySelectorAll(
          '.activity'
        )
      ];


    const data = {

      unitIndex:
        Number(unitIndex),

      employee:
        employee,

      activities:
        []

    };


    /* جمع‌آوری فعالیت‌ها */

    for(
      const c of cards
    ){

      const status =
        c
          .querySelector('.status')
          .value;


      const notes =
        c
          .querySelector('.notes')
          .value
          .trim();


      /* توضیح اجباری برای وضعیت‌های خاص */

      if(
        (
          status === 'متوقف شده' ||
          status === 'در انتظار تأیید'
        ) &&
        !notes
      ){

        showMsg(
          'برای فعالیت متوقف‌شده یا در انتظار تأیید، توضیحات و موانع را وارد کنید.',
          'err'
        );

        return;

      }


      data.activities.push({

        description:
          c
            .querySelector('.description')
            .value
            .trim(),

        status:
          status,

        progress:
          Number(
            c
              .querySelector('.progress')
              .value || 0
          ),

        date:
          c
            .querySelector('.date')
            .value
            .trim(),

        document:
          c
            .querySelector('.document')
            .value
            .trim(),

        responsible:
          c
            .querySelector('.responsible')
            .value
            .trim(),

        nextAction:
          c
            .querySelector('.nextAction')
            .value
            .trim(),

        notes:
          notes

      });

    }


    /* =====================================================
       ارسال به Google Apps Script
       ===================================================== */

    submitBtn.disabled =
      true;

    submitBtn.innerHTML =
      '<span class="spinner"></span>در حال ثبت...';


    try{

      /*
       * no-cors:
       *
       * GitHub Pages مستقیماً به Apps Script وصل می‌شود.
       * مرورگر پاسخ Apps Script را در اختیار JS قرار نمی‌دهد،
       * اما درخواست POST ارسال می‌شود.
       */

      await fetch(
        GOOGLE_APPS_SCRIPT_URL,
        {

          method:
            'POST',

          mode:
            'no-cors',

          headers:{
            'Content-Type':
              'text/plain;charset=UTF-8'
          },

          body:
            JSON.stringify(data)

        }
      );


      /* نمایش موفقیت */

      showMsg(
        'گزارش با موفقیت ارسال شد و برای ثبت در سامانه ارسال گردید.',
        'ok'
      );


      /* پاک کردن فرم */

      document
        .getElementById('unit')
        .value = '';

      document
        .getElementById('employee')
        .value = '';

      activities.innerHTML = '';

      addActivity();


      window.scrollTo({
        top:0,
        behavior:'smooth'
      });


    }catch(error){

      console.error(
        'Submit Error:',
        error
      );


      showMsg(
        'ارسال گزارش انجام نشد. اتصال اینترنت و آدرس Web App را بررسی کنید.',
        'err'
      );


    }finally{

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        'ثبت گزارش روزانه';

    }

  }
);

</script>

</body>
</html>
