<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#f6f0e6">
  <meta name="description" content="سامانه ثبت گزارش وضعیت فعالیت روزانه سپهر">

  <title>گزارش وضعیت فعالیت روزانه | سپهر</title>

  <style>
    :root {
      --bg: #f6f0e6;
      --paper: #fffdf9;
      --paper2: #fbf6ee;
      --ink: #2d261f;
      --muted: #766b60;
      --gold: #b8872f;
      --gold-dark: #8e6324;
      --brown: #6c4b2d;
      --line: #e4d7c5;
      --ok: #28734b;
      --danger: #a33a2b;
      --warning: #8a641e;
      --shadow: 0 16px 45px rgba(92, 65, 35, .12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--ink);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(184, 135, 47, .12),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(108, 75, 45, .07),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #faf7f0,
          #efe5d5
        );
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .wrap {
      width: 100%;
      max-width: 1050px;
      margin: auto;
      padding: 24px 14px 50px;
    }

    /* ================================
       HERO
       ================================ */

    .hero {
      position: relative;
      overflow: hidden;

      padding: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 253, 249, .98),
          rgba(248, 239, 226, .97)
        );

      border: 1px solid var(--line);
      border-radius: 26px;

      box-shadow: var(--shadow);

      animation: fadeUp .55s ease;
    }

    .hero::before {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      opacity: .18;

      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0 3px,
          rgba(108, 75, 45, .04) 4px 5px
        );
    }

    .brand {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 18px;
    }

    .logo {
      width: 92px;
      height: 92px;

      object-fit: contain;

      background: #fff;

      border: 1px solid var(--line);
      border-radius: 18px;

      padding: 7px;

      flex-shrink: 0;
    }

    .logo2 {
      width: 76px;
      height: 76px;
    }

    h1 {
      margin: 0 0 7px;

      color: #3a2a1b;

      font-size: 25px;
      line-height: 1.5;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .notice {
      position: relative;
      z-index: 1;

      margin-top: 18px;

      padding: 15px 17px;

      background: #fff8df;

      border: 1px solid #ead29a;
      border-right: 5px solid var(--gold);
      border-radius: 15px;

      font-size: 14px;
      line-height: 2;
    }

    /* ================================
       CARDS
       ================================ */

    .card {
      margin-top: 16px;

      padding: 18px;

      background: rgba(255, 253, 249, .96);

      border: 1px solid var(--line);
      border-radius: 22px;

      box-shadow:
        0 10px 30px rgba(92, 65, 35, .08);

      animation: fadeUp .65s ease;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;

      padding: 12px 13px;

      color: var(--ink);

      background: #fff;

      border: 1px solid #d8c9b5;
      border-radius: 12px;

      outline: none;

      font-size: 14px;

      transition:
        border-color .2s,
        box-shadow .2s,
        background .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(184, 135, 47, .12);
    }

    input:disabled,
    select:disabled,
    textarea:disabled {
      background: #f7f2ea;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.9;
    }

    /* ================================
       SECTION TITLE
       ================================ */

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 13px;
    }

    .section-title h2 {
      margin: 0;

      font-size: 17px;
    }

    /* ================================
       ACTIVITY
       ================================ */

    .activity {
      position: relative;

      margin-top: 13px;
      padding: 15px;

      background: var(--paper2);

      border: 1px solid var(--line);
      border-radius: 18px;

      animation: fadeUp .35s ease;
    }

    .activity-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;
    }

    .badge {
      padding: 6px 10px;

      color: var(--brown);

      background: #f0e1ca;

      border-radius: 999px;

      font-size: 12px;
      font-weight: 800;
    }

    .activity-grid {
      display: grid;

      grid-template-columns:
        2fr 1fr 1fr;

      gap: 12px;
    }

    .activity-grid .wide {
      grid-column: span 3;
    }

    /* ================================
       BUTTONS
       ================================ */

    .actions {
      display: flex;

      gap: 10px;
      flex-wrap: wrap;

      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 13px;

      padding: 12px 18px;

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform .15s,
        box-shadow .15s,
        opacity .15s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .primary {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--gold-dark)
        );

      box-shadow:
        0 9px 20px rgba(142, 99, 36, .22);
    }

    .secondary {
      color: #5b4027;
      background: #f1e5d3;
    }

    .danger {
      padding: 7px 12px;

      color: #9a3729;

      background: #f7e2de;

      font-size: 12px;
    }

    /* ================================
       MESSAGE
       ================================ */

    #message {
      display: none;

      margin-top: 14px;
      padding: 13px 15px;

      border-radius: 13px;

      font-weight: 700;
      line-height: 1.8;
    }

    #message.ok {
      display: block;

      color: #21633f;

      background: #e5f4eb;

      border: 1px solid #b9dec7;
    }

    #message.err {
      display: block;

      color: #8c3025;

      background: #fbe8e5;

      border: 1px solid #efc2bb;
    }

    #message.warning {
      display: block;

      color: #74531b;

      background: #fff5d8;

      border: 1px solid #ead39a;
    }

    /* ================================
       SPINNER
       ================================ */

    .spinner {
      display: inline-block;

      width: 15px;
      height: 15px;

      margin-left: 7px;

      vertical-align: -2px;

      border: 2px solid rgba(255, 255, 255, .45);
      border-top-color: #fff;

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    /* ================================
       API STATUS
       ================================ */

    .api-status {
      margin-top: 10px;

      color: var(--muted);

      text-align: center;

      font-size: 11px;
    }

    .api-dot {
      display: inline-block;

      width: 7px;
      height: 7px;

      margin-left: 5px;

      background: #c49a4a;

      border-radius: 50%;
    }

    /* ================================
       MOBILE
       ================================ */

    @media (max-width: 720px) {

      .wrap {
        padding: 12px 10px 35px;
      }

      .hero {
        padding: 15px;
        border-radius: 20px;
      }

      .brand {
        gap: 10px;
      }

      .logo {
        width: 68px;
        height: 68px;
      }

      .logo2 {
        width: 57px;
        height: 57px;
      }

      h1 {
        font-size: 20px;
      }

      .subtitle {
        font-size: 11px;
      }

      .grid,
      .activity-grid {
        grid-template-columns: 1fr;
      }

      .activity-grid .wide {
        grid-column: span 1;
      }

      .card {
        padding: 14px;
        border-radius: 18px;
      }

      .section-title {
        align-items: flex-start;
      }

      .section-title button {
        white-space: nowrap;
      }

      .actions button {
        width: 100%;
      }
    }

    /* ================================
       ANIMATIONS
       ================================ */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <!-- ================================
       HEADER
       ================================ -->

  <header class="hero">

    <div class="brand">

      <img
        class="logo"
        src="./logo.png"
        alt="لوگوی سپهر"
        onerror="this.style.display='none'"
      >

      <div style="text-align:center">

        <h1>

        </h1>

        <div class="subtitle">

      </div>

      <img

    <div class="notice">

      لطفاً
      <b>

      </b>
      ثبت نمایید.

      <br>

      <b>
        توجه:
      </b>

      عدم ثبت این فرم به منزله عدم انجام فعالیت
      در روز جاری تلقی خواهد شد.

    </div>

  </header>


  <!-- ================================
       FORM
       ================================ -->

  <form
    id="reportForm"
    novalidate
  >

    <!-- EMPLOYEE -->

    <section class="card">

      <div class="grid">

        <div class="field">

          <label for="unit">
            واحد / دپارتمان *
          </label>

          <select
            id="unit"
            required
          >

            <option value="">
              انتخاب واحد...
            </option>

            <option value="0">
              مارکتینگ
            </option>

            <option value="1">
              مالی
            </option>

            <option value="2">
              حقوقی
            </option>

            <option value="3">
              دفتر مدیر عامل
            </option>

            <option value="4">
              منابع انسانی
            </option>

          </select>

        </div>


        <div class="field">

          <label for="employee">
            نام و نام خانوادگی *
          </label>

          <input
            id="employee"
            required
            placeholder="نام و نام خانوادگی"
            autocomplete="name"
          >

        </div>

      </div>

    </section>


    <!-- ACTIVITIES -->

    <section class="card">

      <div class="section-title">

        <h2>
          گزارش وضعیت فعالیت‌ها
        </h2>

        <button
          type="button"
          class="secondary"

        >
          ＋ افزودن فعالیت

      </div>


      <div id="activities"></div>


      <div class="actions">

        <button
          class="primary"
          id="submitBtn"

        >
          ثبت گزارش روزانه
        </button>

      </div>


      <div id="message"></div>


      <div class="api-status">
        <span class="api-dot"></span>
        اتصال فرم به سامانه ثبت گزارش سپهر
      </div>

    </section>

  </form>

</div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

/*
 * Google Apps Script Web App
 *
 * این URL باید همان Deployment فعلی Code.gs باشد.
 */

const GOOGLE_APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbymcEOkxod2e0iTewyug7MF49kmLqHg8b1Ps06C6Gtkmh1M_5ztgxnYw-qa3OU6Gcrj/exec';


/*
 * نسخه Frontend
 */

const FRONTEND_VERSION = '12.0.0';


/* =========================================================
   DOM
   ========================================================= */

const activitiesContainer =
  document.getElementById('activities');

const form =
  document.getElementById('reportForm');

const messageBox =
  document.getElementById('message');

const submitBtn =
  document.getElementById('submitBtn');

const addBtn =
  document.getElementById('addBtn');

const unitInput =
  document.getElementById('unit');

const employeeInput =
  document.getElementById('employee');


/* =========================================================
   JALALI DATE
   ========================================================= */

function pad(number) {

  return String(number).padStart(2, '0');

}


function gregorianToJalali(gy, gm, gd) {

  const gdm = [
    0,
    31,
    59,
    90,
    120,
    151,
    181,
    212,
    243,
    273,
    304,
    334
  ];

  let gy2 =
    gm > 2
      ? gy + 1
      : gy;

  let days =
    355666 +
    365 * gy +
    Math.floor((gy2 + 3) / 4) -
    Math.floor((gy2 + 99) / 100) +
    Math.floor((gy2 + 399) / 400) +
    gd +
    gdm[gm - 1];

  let jy =
    -1595 +
    33 * Math.floor(days / 12053);

  days %= 12053;

  jy +=
    4 * Math.floor(days / 1461);

  days %= 1461;

  if (days > 365) {

    jy +=
      Math.floor((days - 1) / 365);

    days =
      (days - 1) % 365;

  }

  const jm =
    days < 186
      ? 1 + Math.floor(days / 31)
      : 7 + Math.floor((days - 186) / 30);

  const jd =
    1 +
    (
      days < 186
        ? days % 31
        : (days - 186) % 30
    );

  return `${jy}/${pad(jm)}/${pad(jd)}`;

}


function todayJalali() {

  const now =
    new Date();

  return gregorianToJalali(
    now.getFullYear(),
    now.getMonth() + 1,
    now.getDate()
  );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type = 'err') {

  messageBox.textContent =
    text;

  messageBox.className =
    '';

  messageBox.classList.add(type);

  messageBox.style.display =
    'block';

}


function hideMessage() {

  messageBox.textContent =
    '';

  messageBox.className =
    '';

  messageBox.style.display =
    'none';

}


/* =========================================================
   ACTIVITY NUMBER
   ========================================================= */

function updateActivityNumbers() {

  const cards =
    document.querySelectorAll('.activity');

  cards.forEach(
    function(card, index) {

      const badge =
        card.querySelector('.badge');

      if (badge) {

        badge.textContent =
          `فعالیت ${index + 1}`;

      }

    }
  );

}


/* =========================================================
   ADD ACTIVITY
   ========================================================= */

function addActivity() {

  const activity =
    document.createElement('div');

  activity.className =
    'activity';

  activity.innerHTML = `

    <div class="activity-head">

      <span class="badge">
        فعالیت 1
      </span>

      <button
        type="button"
        class="danger remove"
      >
        حذف
      </button>

    </div>


    <div class="activity-grid">


      <!-- DESCRIPTION -->

      <div class="field wide">

        <label>
          شرح فعالیت / پروژه *
        </label>

        <textarea
          class="description"
          required
          placeholder="فعالیت انجام‌شده را دقیق و به ترتیب زمانی بنویسید."
        ></textarea>

      </div>


      <!-- STATUS -->

      <div class="field">

        <label>
          وضعیت *
        </label>

        <select
          class="status"
          required
        >

          <option value="">
            انتخاب...
          </option>

          <option value="انجام شد">
            انجام شد
          </option>

          <option value="در حال انجام">
            در حال انجام
          </option>

          <option value="متوقف شده">
            متوقف شده
          </option>

          <option value="در انتظار تأیید">
            در انتظار تأیید
          </option>

        </select>

      </div>


      <!-- PROGRESS -->

      <div class="field">

        <label>
          درصد پیشرفت *
        </label>

        <input
          class="progress"
          type="number"
          min="0"
          max="100"
          step="1"
          value="0"
          required
        >

      </div>


      <!-- DATE -->

      <div class="field">

        <label>
          تاریخ *
        </label>

        <input
          class="date"
          value="${todayJalali()}"
          required
          inputmode="numeric"
          placeholder="1405/06/29"
        >

      </div>


      <!-- DOCUMENT -->

      <div class="field">

        <label>
          مبلغ / سند مرتبط
        </label>

        <input
          class="document"
          placeholder="اختیاری"
        >

      </div>


      <!-- RESPONSIBLE -->

      <div class="field">

        <label>
          مسئول *
        </label>

        <input
          class="responsible"
          required
          placeholder="نام مسئول"
        >

      </div>


      <!-- NEXT ACTION -->

      <div class="field">

        <label>
          اقدام بعدی *
        </label>

        <input
          class="nextAction"
          required
          placeholder="اقدام بعدی"
        >

      </div>


      <!-- NOTES -->

      <div class="field wide">

        <label>
          توضیحات و موانع
        </label>

        <textarea
          class="notes"
          placeholder="در صورت توقف یا انتظار تأیید، توضیح مانع یا وضعیت را وارد کنید."
        ></textarea>

      </div>


    </div>
  `;


  activitiesContainer.appendChild(
    activity
  );


  const removeButton =
    activity.querySelector('.remove');


  removeButton.addEventListener(
    'click',
    function() {

      const count =
        activitiesContainer.children.length;

      if (count <= 1) {

        showMessage(
          'حداقل یک فعالیت باید ثبت شود.',
          'err'
        );

        return;

      }

      activity.remove();

      updateActivityNumbers();

      hideMessage();

    }
  );


  /*
   * اگر وضعیت متوقف یا در انتظار تأیید شد،
   * توضیحات به صورت بصری مشخص می‌شود.
   */

  const status =
    activity.querySelector('.status');

  const notes =
    activity.querySelector('.notes');

  status.addEventListener(
    'change',
    function() {

      const requiresNotes =
        status.value === 'متوقف شده' ||
        status.value === 'در انتظار تأیید';

      if (requiresNotes) {

        notes.style.borderColor =
          '#b8872f';

        notes.placeholder =
          'برای این وضعیت، توضیح مانع یا دلیل انتظار تأیید الزامی است.';

      } else {

        notes.style.borderColor =
          '';

        notes.placeholder =
          'در صورت توقف یا انتظار تأیید، توضیح مانع یا وضعیت را وارد کنید.';

      }

    }
  );


  updateActivityNumbers();

}


/* =========================================================
   INITIAL ACTIVITY
   ========================================================= */

addActivity();


/* =========================================================
   ADD BUTTON
   ========================================================= */

addBtn.addEventListener(
  'click',
  function() {

    addActivity();

    const cards =
      document.querySelectorAll('.activity');

    const last =
      cards[cards.length - 1];

    if (last) {

      last.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });

    }

  }
);


/* =========================================================
   COLLECT ACTIVITY
   ========================================================= */

function collectActivities() {

  const cards =
    [
      ...document.querySelectorAll('.activity')
    ];

  const result = [];


  for (
    let index = 0;
    index < cards.length;
    index++
  ) {

    const card =
      cards[index];


    const description =
      card
        .querySelector('.description')
        .value
        .trim();


    const status =
      card
        .querySelector('.status')
        .value;


    const progressValue =
      card
        .querySelector('.progress')
        .value;


    const date =
      card
        .querySelector('.date')
        .value
        .trim();


    const documentValue =
      card
        .querySelector('.document')
        .value
        .trim();


    const responsible =
      card
        .querySelector('.responsible')
        .value
        .trim();


    const nextAction =
      card
        .querySelector('.nextAction')
        .value
        .trim();


    const notes =
      card
        .querySelector('.notes')
        .value
        .trim();


    /*
     * اعتبارسنجی اختصاصی
     */

    if (!description) {

      throw new Error(
        `شرح فعالیت ${index + 1} وارد نشده است.`
      );

    }


    if (!status) {

      throw new Error(
        `وضعیت فعالیت ${index + 1} انتخاب نشده است.`
      );

    }


    const progress =
      Number(progressValue);


    if (
      !Number.isFinite(progress) ||
      progress < 0 ||
      progress > 100
    ) {

      throw new Error(
        `درصد پیشرفت فعالیت ${index + 1} باید بین ۰ تا ۱۰۰ باشد.`
      );

    }


    if (!date) {

      throw new Error(
        `تاریخ فعالیت ${index + 1} وارد نشده است.`
      );

    }


    if (!responsible) {

      throw new Error(
        `مسئول فعالیت ${index + 1} وارد نشده است.`
      );

    }


    if (!nextAction) {

      throw new Error(
        `اقدام بعدی فعالیت ${index + 1} وارد نشده است.`
      );

    }


    /*
     * توضیحات برای وضعیت‌های خاص اجباری است.
     */

    if (
      (
        status === 'متوقف شده' ||
        status === 'در انتظار تأیید'
      ) &&
      !notes
    ) {

      throw new Error(
        `برای فعالیت ${index + 1} با وضعیت «${status}»، توضیحات و موانع الزامی است.`
      );

    }


    /*
     * ساخت آبجکت دقیقاً مطابق Code.gs
     */

    result.push({

      description:
        description,

      status:
        status,

      progress:
        progress,

      date:
        date,

      document:
        documentValue,

      responsible:
        responsible,

      nextAction:
        nextAction,

      notes:
        notes

    });

  }


  return result;

}


/* =========================================================
   BUILD PAYLOAD
   ========================================================= */

function buildPayload() {

  const unitValue =
    unitInput.value;


  const employee =
    employeeInput.value.trim();


  if (!unitValue) {

    throw new Error(
      'لطفاً واحد / دپارتمان را انتخاب کنید.'
    );

  }


  if (!employee) {

    throw new Error(
      'لطفاً نام و نام خانوادگی را وارد کنید.'
    );

  }


  const unitIndex =
    Number(unitValue);


  if (
    !Number.isInteger(unitIndex) ||
    unitIndex < 0 ||
    unitIndex > 4
  ) {

    throw new Error(
      'واحد انتخاب‌شده معتبر نیست.'
    );

  }


  const activityList =
    collectActivities();


  if (
    activityList.length === 0
  ) {

    throw new Error(
      'حداقل یک فعالیت باید ثبت شود.'
    );

  }


  /*
   * این دقیقاً همان ساختاری است
   * که Code.gs انتظار دارد.
   */

  return {

    unitIndex:
      unitIndex,

    employee:
      employee,

    activities:
      activityList

  };

}


/* =========================================================
   RESET FORM
   ========================================================= */

function resetForm() {

  unitInput.value =
    '';

  employeeInput.value =
    '';

  activitiesContainer.innerHTML =
    '';

  addActivity();

}


/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener(
  'submit',
  async function(event) {

    event.preventDefault();


    hideMessage();


    /*
     * اعتبارسنجی HTML
     */

    if (
      !form.reportValidity()
    ) {

      return;

    }


    let payload;


    /*
     * ساخت Payload
     */

    try {

      payload =
        buildPayload();

    } catch (error) {

      showMessage(
        error.message ||
        'اطلاعات فرم کامل نیست.',
        'err'
      );

      return;

    }


    /*
     * جلوگیری از ارسال همزمان
     */

    submitBtn.disabled =
      true;

    addBtn.disabled =
      true;


    submitBtn.innerHTML =
      '<span class="spinner"></span>در حال ثبت گزارش...';


    try {

      /*
       * ===================================================
       * POST TO GOOGLE APPS SCRIPT
       * ===================================================
       *
       * توجه:
       *
       * mode = no-cors
       *
       * باعث می‌شود مرورگر پاسخ Apps Script را
       * در اختیار JavaScript قرار ندهد.
       *
       * اما POST به Web App ارسال می‌شود.
       *
       * Content-Type = text/plain
       * عمداً استفاده شده تا preflight پیچیده CORS
       * ایجاد نشود.
       */

      await fetch(
        GOOGLE_APPS_SCRIPT_URL,
        {

          method:
            'POST',

          mode:
            'no-cors',

          headers: {

            'Content-Type':
              'text/plain;charset=UTF-8'

          },

          body:
            JSON.stringify(payload)

        }
      );


      /*
       * چون no-cors است، اینجا فقط می‌دانیم
       * fetch بدون خطای شبکه Promise را کامل کرده است.
       *
       * پاسخ واقعی سرور قابل خواندن نیست.
       */

      showMessage(
        `گزارش ${payload.activities.length} فعالیت با موفقیت برای سامانه ارسال شد.`,
        'ok'
      );


      /*
       * پاک کردن فرم
       */

      resetForm();


      /*
       * رفتن به بالای صفحه
       */

      window.scrollTo({

        top: 0,

        behavior: 'smooth'

      });


    } catch (error) {

      console.error(
        'SepehrReport Submit Error:',
        error
      );


      showMessage(
        'ارسال گزارش انجام نشد. اتصال اینترنت یا آدرس Google Apps Script را بررسی کنید.',
        'err'
      );


    } finally {

      submitBtn.disabled =
        false;

      addBtn.disabled =
        false;

      submitBtn.textContent =
        'ثبت گزارش روزانه';

    }

  }
);

   DEBUG
   ========================================================= */

console.log(
  'SepehrReport Frontend',
  FRONTEND_VERSION
);

console.log(
  'Apps Script URL:',
  GOOGLE_APPS_SCRIPT_URL
);

</script>
